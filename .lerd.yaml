domains:
  - react-spa
php_version: "8.5"
node_version: "24"
framework: laravel
secured: true
services:
  - mailpit
  - postgres
  - redis
workers:
  - queue
  - reverb
  - vite
db:
  service: postgres
  database: react-spa
env_overrides:
  APP_PORT: "80"
  APP_SCHEME: '{{scheme}}'
  APP_URL: '{{scheme}}://{{domain}}'
  HOST_NAME: '{{domain}}'
  REVERB_HOST: 127.0.0.1
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  VITE_DEV_SERVER_URL: http://{{domain}}:5173
  VITE_REVERB_HOST: '{{domain}}'
  VITE_REVERB_PORT: "80"
  VITE_REVERB_SCHEME: '{{scheme}}'
